name: Release package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.11"
      - run: uv sync --frozen --dev
      - run: uv run python -m pytest tests/test_version.py -q
      - run: uv run python -m pytest tests/test_compatibility_manifest.py -q
      - run: uv run python -m pytest tests -q
      - run: uv run ruff check controller scripts tests
      - run: uv run ruff format --check controller scripts tests
      - run: uv run mypy --ignore-missing-imports controller
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: vllm-switch-controller-dist
          path: dist/*
          if-no-files-found: error

  # Publishing is intentionally not automatic. Maintainers inspect the
  # artifacts, pin companion repository commits in release notes, and publish
  # through the repository host's trusted release process.
