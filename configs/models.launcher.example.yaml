# Launcher-managed example. 
# Copy to configs/models.local.yaml and edit aliases, model names, launch command.
models:
  model-a:
    backend_url: http://127.0.0.1:8101
    served_model_name: model-a
    sleep_level: 1
    # null sends no tags and a non-empty list will be sent as vllm wake_up tags parameters.
    wake_tags: null
    cwd: /path/to/vllm-switch-checkout
    env:
      # PATH and PYTHONPATH are optional but recommended for vllm to find the correct Python environment and modules.
      # PATH: /path/to/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # PYTHONPATH: /path/to/vllm-switch-checkout
      # Environment variables for the vLLM server.
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_CPU_BACKUP_COORDINATOR: http
      VLLM_CPU_BACKUP_COORDINATOR_URL: http://127.0.0.1:9000
      VLLM_CPU_BACKUP_COORDINATOR_MODEL_ID: model-a
      VLLM_CPU_BACKUP_COORDINATOR_CLIENT_ID: model-a
      VLLM_CPU_BACKUP_COORDINATOR_TIMEOUT_S: "1.0"
      VLLM_CPU_BACKUP_COORDINATOR_POLL_INTERVAL_S: "0.1"
      # Exact disk is opt-in and uses only the canonical vLLM variables.
      # VLLM_EXACT_DISK_BACKUP_ENABLED: "1"
      # VLLM_EXACT_DISK_BACKUP_DIR: /path/to/fast-local-backup
      # VLLM_EXACT_DISK_BACKUP_CHUNK_BYTES: "16777216"
      # VLLM_EXACT_DISK_BACKUP_DIRECT_IO: "1"
      # Detailed profiling is also opt-in.
      # VLLM_SLEEP_PROFILE_PATH: /path/to/model-a-sleep-profile.jsonl
    launch_command:
      - /path/to/venv/bin/python
      - -m
      - vllm.entrypoints.openai.api_server
      - --model
      - /path/to/model-a
      - --host
      - 127.0.0.1
      - --port
      - "8101"
      - --served-model-name
      - model-a
      - --enable-sleep-mode
      - --enable-request-id-headers
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --dtype
      - auto
  model-b:
    backend_url: http://127.0.0.1:8102
    served_model_name: model-b
    sleep_level: 1
    wake_tags: null
    cwd: /path/to/vllm-switch-checkout
    env:
      # PATH: /path/to/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # PYTHONPATH: /path/to/vllm-switch-checkout
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_CPU_BACKUP_COORDINATOR: http
      VLLM_CPU_BACKUP_COORDINATOR_URL: http://127.0.0.1:9000
      VLLM_CPU_BACKUP_COORDINATOR_MODEL_ID: model-b
      VLLM_CPU_BACKUP_COORDINATOR_CLIENT_ID: model-b
      VLLM_CPU_BACKUP_COORDINATOR_TIMEOUT_S: "1.0"
      VLLM_CPU_BACKUP_COORDINATOR_POLL_INTERVAL_S: "0.1"
      # VLLM_EXACT_DISK_BACKUP_ENABLED: "1"
      # VLLM_EXACT_DISK_BACKUP_DIR: /path/to/fast-local-backup
      # VLLM_EXACT_DISK_BACKUP_CHUNK_BYTES: "16777216"
      # VLLM_EXACT_DISK_BACKUP_DIRECT_IO: "1"
      # VLLM_SLEEP_PROFILE_PATH: /path/to/model-b-sleep-profile.jsonl
    launch_command:
      - /path/to/venv/bin/python
      - -m
      - vllm.entrypoints.openai.api_server
      - --model
      - /path/to/model-b
      - --host
      - 127.0.0.1
      - --port
      - "8102"
      - --served-model-name
      - model-b
      - --enable-sleep-mode
      - --enable-request-id-headers
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --dtype
      - auto

controller:
  host: 127.0.0.1
  port: 9000
  policy: always_sleep_previous
  startup_awake_model: model-a
  request_timeout_s: 600
  switch_timeout_s: 600
  metrics_path: results/controller_events.jsonl

  # Optional host-memory pressure policy. Ratios are paired low/high
  # watermarks. Remove all four watermark fields to disable the monitor.
  cpu_memory_reclaim_available_ratio: 0.15
  cpu_memory_recovery_available_ratio: 0.20
  cpu_memory_reclaim_available_bytes: 8589934592       # 8 GiB
  cpu_memory_recovery_available_bytes: 12884901888     # 12 GiB
  cpu_memory_poll_interval_s: 0.5
  cpu_memory_pressure_consecutive_samples: 3
  cpu_memory_reclaim_cooldown_s: 2.0

  # Optional hard guard. null leaves live host pressure as the primary policy.
  cpu_backup_global_cap_bytes: null
  cpu_backup_default_model_priority: 0
  cpu_backup_model_priorities:
    model-a: 10
    model-b: 0
