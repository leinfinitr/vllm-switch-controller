[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-switch-controller"
version = "0.1.0"
description = "External model-switching control plane for vllm-switch"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "vllm-switch-controller contributors"},
]
keywords = ["vllm", "llm", "model-serving", "model-switching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0,<1",
    "httpx>=0.27.0,<1",
    "pydantic>=2.7.0,<3",
    "pyyaml>=6.0.0,<7",
    "uvicorn>=0.30.0,<1",
]

[project.urls]
Homepage = "https://github.com/leinfinitr/vllm-switch-controller"
Documentation = "https://github.com/leinfinitr/vllm-switch-controller/tree/master/docs"
Issues = "https://github.com/leinfinitr/vllm-switch-controller/issues"
Source = "https://github.com/leinfinitr/vllm-switch-controller"

[project.scripts]
vllm-switch-controller = "vllm_switch_controller.main:main"
vllm-switch-launch = "scripts.launch_vllm_pool:main"
vllm-switch-smoke = "scripts.smoke_openai_switch:main"
vllm-switch-stop = "scripts.stop_vllm_pool:main"

[dependency-groups]
dev = [
    "build>=1.2.2,<2",
    "mypy>=1.14,<2",
    "packaging>=24,<27",
    "pytest>=8.2.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "ruff>=0.6.0,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["vllm_switch_controller", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
