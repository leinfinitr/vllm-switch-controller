name: Bug report
description: Report a reproducible controller defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private model data. Report security issues privately.
  - type: input
    id: controller-version
    attributes:
      label: Controller version or commit
      placeholder: Package metadata version or commit SHA
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: vllm-switch version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, CUDA, GPU, and relevant configuration without secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, request payload shape, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
