name: Feature request
description: Propose a focused improvement within the controller scope
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete operator, correctness, or research need is unmet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest interface or behavior change that solves it.
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Repository ownership
      options:
        - Controller routing/lifecycle
        - vllm-switch allocator/worker
        - Benchmark/evidence
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and non-goals
